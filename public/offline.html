<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <title>PontoGlass — Sem conexão</title>
  <style>
    *,*::before,*::after{box-sizing:border-box}*{margin:0;padding:0}
    html,body{height:100%;background:#08090b;color:#ededed;font-family:'Inter',ui-sans-serif,system-ui,-apple-system,sans-serif}
    body{display:grid;place-items:center;padding:24px}
    .card{background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.08);border-radius:14px;padding:40px 32px;text-align:center;max-width:320px;width:100%}
    .icon{font-size:48px;margin-bottom:16px}
    h1{font-size:20px;font-weight:600;margin-bottom:8px}
    p{font-size:13px;color:#a3a3a7;margin-bottom:24px;line-height:1.5}
    button{display:inline-flex;align-items:center;justify-content:center;height:36px;padding:0 20px;border-radius:6px;font-size:13px;font-weight:500;border:none;background:#7c8cf8;color:#0c0d10;cursor:pointer;transition:background 0.12s}
    button:hover{background:#9aa5ff}
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">📡</div>
    <h1>Sem conexão</h1>
    <p>Você está offline. Verifique sua conexão e tente novamente.</p>
    <button onclick="location.reload()">Tentar novamente</button>
  </div>
</body>
</html>
